name: Build Dux Apps - Arch Linux x86-64-v3

on:
  workflow_dispatch:
    inputs:
      release_dux_files:
        description: "Include dux-files-git in the GitHub Release"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout Dux Apps
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --needed \
            base-devel \
            git \
            go \
            zstd \
            cmake \
            ninja \
            ccache \
            qt6-base \
            qt6-declarative \
            qt6-shadertools \
            vulkan-headers \
            cli11 \
            wayland-protocols \
            pipewire \
            polkit \
            greetd \
            quickshell

          # Enable multi-threaded ultra Zstd compression in makepkg
          sed -i 's/^COMPRESSZST=.*/COMPRESSZST=(zstd -c -T0 --ultra -20 -)/' /etc/makepkg.conf

      - name: Resolve upstream commits for cache key
        id: upstream
        run: |
          set -euo pipefail
          HASH=$(
            for repo in dux-calendar dux-gop dux-files dux-greeter; do
              git ls-remote "https://github.com/duxlabs-dev/${repo}.git" HEAD | awk '{print $1}'
            done | sha256sum | cut -c1-12
          )
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"

      - name: Prepare builder user and directories
        run: |
          set -euo pipefail
          useradd --create-home --shell /bin/bash builder
          mkdir -p \
            /home/builder/go/pkg/mod \
            /home/builder/.cache/go-build \
            /home/builder/.cache/ccache

      - name: Cache Go modules, Go build cache, and ccache
        uses: actions/cache@v4
        with:
          path: |
            /home/builder/go/pkg/mod
            /home/builder/.cache/go-build
            /home/builder/.cache/ccache
          key: dux-apps-zen3-${{ runner.os }}-${{ steps.upstream.outputs.hash }}
          restore-keys: |
            dux-apps-zen3-${{ runner.os }}-

      - name: Fix workspace and cache ownership
        run: |
          set -euo pipefail
          chown -R builder:builder "$GITHUB_WORKSPACE" /home/builder

      - name: Build and package applications
        shell: bash
        env:
          RELEASE_DUX_FILES: ${{ inputs.release_dux_files || false }}
        run: |
          runuser -u builder -- env \
            HOME="/home/builder" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RELEASE_DUX_FILES="$RELEASE_DUX_FILES" \
            bash -s <<'BUILD'

          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/dux-build"
          SOURCES="$ROOT/sources"
          STAGES="$ROOT/stages"
          DIST="$ROOT/dist"
          NOTES="$DIST/RELEASE_BODY.md"

          mkdir -p "$SOURCES" "$STAGES" "$DIST"

          # Parallelism & caching
          NPROC="$(nproc)"
          export MAKEFLAGS="-j${NPROC}"
          export CMAKE_BUILD_PARALLEL_LEVEL="${NPROC}"
          export GOPATH="/home/builder/go"
          export GOMODCACHE="/home/builder/go/pkg/mod"
          export GOCACHE="/home/builder/.cache/go-build"
          export CCACHE_DIR="/home/builder/.cache/ccache"
          export CMAKE_C_COMPILER_LAUNCHER="ccache"
          export CMAKE_CXX_COMPILER_LAUNCHER="ccache"

          # Target x86-64-v3 / Zen 3 (lean -O2 + relative relocs)
          export GOAMD64=v3
          export CFLAGS="-march=znver3 -mtune=znver3 -O2 -pipe -fno-plt"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-Wl,-O2,--as-needed,-z,pack-relative-relocs"
          export CGO_CFLAGS="$CFLAGS"
          export CGO_CXXFLAGS="$CXXFLAGS"
          export CGO_LDFLAGS="$LDFLAGS"
          export CMAKE_INTERPROCEDURAL_OPTIMIZATION=ON

          # Clone all 4 repos in parallel (keep full history for pkgver commit count)
          clone_repo() {
            local name="$1"
            local url="$2"
            git clone --recurse-submodules --shallow-submodules "$url" "$SOURCES/$name"
          }

          clone_repo dux-calendar https://github.com/duxlabs-dev/dux-calendar.git &
          clone_repo dux-gop      https://github.com/duxlabs-dev/dux-gop.git &
          clone_repo dux-files    https://github.com/duxlabs-dev/dux-files.git &
          clone_repo dux-greeter  https://github.com/duxlabs-dev/dux-greeter.git &
          wait

          # Build Dux Calendar
          CAL_STAGE="$STAGES/dux-calendar"
          mkdir -p "$CAL_STAGE"
          cd "$SOURCES/dux-calendar"
          make -j"${NPROC}"
          make PREFIX=/usr DESTDIR="$CAL_STAGE" install
          test -x "$CAL_STAGE/usr/bin/dcal"

          # Build Dux GOP
          GOP_STAGE="$STAGES/dux-gop"
          mkdir -p "$GOP_STAGE/usr/bin"
          cd "$SOURCES/dux-gop"
          make -j"${NPROC}"
          test -x bin/dgop
          install -Dm755 bin/dgop "$GOP_STAGE/usr/bin/dgop"

          # Build Dux Files (always built & packaged; release controlled by RELEASE_DUX_FILES)
          FILES_STAGE="$STAGES/dux-files"
          mkdir -p "$FILES_STAGE"
          cd "$SOURCES/dux-files"
          make -j"${NPROC}"
          make PREFIX=/usr DESTDIR="$FILES_STAGE" install
          test -x "$FILES_STAGE/usr/bin/dfiles"

          # Build Dux Greeter with Qt Base integration
          GREETER_STAGE="$STAGES/dux-greeter"
          mkdir -p "$GREETER_STAGE"
          cd "$SOURCES/dux-greeter"
          make -j"${NPROC}" QTBASE=1 build
          make QTBASE=1 PREFIX=/usr DESTDIR="$GREETER_STAGE" install
          test -x "$GREETER_STAGE/usr/bin/dms-greeter"

          # Add license and README files
          add_docs() {
            local repo="$1"
            local stage="$2"
            local package="$3"

            [[ -f "$repo/LICENSE" ]] && install -Dm644 "$repo/LICENSE" "$stage/usr/share/licenses/$package/LICENSE"
            [[ -f "$repo/README.md" ]] && install -Dm644 "$repo/README.md" "$stage/usr/share/doc/$package/README.md"
          }

          add_docs "$SOURCES/dux-calendar" "$CAL_STAGE"     dux-calendar-git
          add_docs "$SOURCES/dux-gop"      "$GOP_STAGE"     dux-gop-git
          add_docs "$SOURCES/dux-files"    "$FILES_STAGE"   dux-files-git
          add_docs "$SOURCES/dux-greeter"  "$GREETER_STAGE" dux-greeter

          # Verify GOAMD64=v3 in every Go binary
          verify_go_binary() {
            local binary="$1"
            echo "Checking: $binary"
            go version -m "$binary" | grep -F 'GOAMD64=v3'
          }

          verify_go_binary "$CAL_STAGE/usr/bin/dcal"
          verify_go_binary "$GOP_STAGE/usr/bin/dgop"
          verify_go_binary "$FILES_STAGE/usr/bin/dfiles"
          verify_go_binary "$GREETER_STAGE/usr/bin/dms-greeter"

          # Initialize dynamic release notes
          PKG_LIST_FILE="$ROOT/released_packages.md"
          : > "$PKG_LIST_FILE"

          # Create a standalone Arch package from a staged filesystem
          build_arch_package() {
            local name="$1"
            local label="$2"
            local stage="$3"
            local repo="$4"
            local dependencies="$5"
            local publish="${6:-true}"

            local count short_sha pkgver pkgdir payload output_dir package_file
            local -a packages

            cd "$repo"
            count="$(git rev-list --count HEAD)"
            short_sha="$(git rev-parse --short=8 HEAD)"
            pkgver="0.0.0.r${count}.g${short_sha}"

            pkgdir="$ROOT/pkgbuild-$name"
            payload="$pkgdir/payload"
            output_dir="$pkgdir/out"

            rm -rf "$pkgdir"
            mkdir -p "$payload" "$output_dir"
            cp -a "$stage/." "$payload/"

            cat > "$pkgdir/PKGBUILD" <<EOF
          pkgname='$name'
          pkgver='$pkgver'
          pkgrel=1
          pkgdesc='Dux Labs application - Zen 3 (x86-64-v3) build'
          arch=('x86_64')
          url='https://github.com/duxlabs-dev'
          license=('custom')
          options=('strip' '!debug' '!lto')
          depends=($dependencies)
          source=()
          sha256sums=()

          package() {
            install -d "\$pkgdir"
            cp -a "\$startdir/payload/." "\$pkgdir/"
          }
          EOF

            cd "$pkgdir"
            PKGDEST="$output_dir" makepkg \
              --nodeps \
              --cleanbuild \
              --noconfirm \
              --force

            mapfile -t packages < <(
              find "$output_dir" -maxdepth 1 -type f \
                -name "${name}-*.pkg.tar.zst" \
                ! -name '*-debug-*'
            )

            if [[ "${#packages[@]}" -ne 1 ]]; then
              echo "Expected one main package for $name, found ${#packages[@]}"
              find "$output_dir" -maxdepth 1 -type f -printf '%f\n'
              return 1
            fi

            package_file="${packages[0]}"

            if [[ "$publish" == "true" ]]; then
              install -Dm644 "$package_file" \
                "$DIST/${name}-${pkgver}-1-x86_64_v3.pkg.tar.zst"
              echo "- **${label}** (\`${name}\` \`${pkgver}\`)" >> "$PKG_LIST_FILE"
              echo "Created (released): ${name}-${pkgver}-1-x86_64_v3.pkg.tar.zst"
            else
              echo "Created (build-only, skipped release): $(basename "$package_file")"
            fi
          }

          build_arch_package dux-calendar-git "Dux Calendar" "$CAL_STAGE"     "$SOURCES/dux-calendar" "'quickshell'"            true
          build_arch_package dux-gop-git      "Dux GOP"      "$GOP_STAGE"     "$SOURCES/dux-gop"      ""                        true
          build_arch_package dux-files-git    "Dux Files"    "$FILES_STAGE"   "$SOURCES/dux-files"    "'quickshell'"            "$RELEASE_DUX_FILES"
          build_arch_package dux-greeter      "Dux Greeter"  "$GREETER_STAGE" "$SOURCES/dux-greeter"  "'greetd' 'quickshell'"   true

          # Generate checksums and release body
          cd "$DIST"
          sha256sum *.pkg.tar.zst > SHA256SUMS

          cat > "$NOTES" <<EOF
          ## Dux Apps - Arch Linux Packages

          Optimized for **Zen 3 / x86-64-v3** (\`GOAMD64=v3\`, \`-march=znver3 -O2\`, \`pack-relative-relocs\`, ultra Zstd).

          ### Packages
          $(cat "$PKG_LIST_FILE")

          Dux Greeter is built with \`QTBASE=1\`. Package architecture metadata remains \`x86_64\`; the \`_x86_64_v3\` suffix identifies the optimized target.

          ### Install & Verify
          \`\`\`bash
          sha256sum -c SHA256SUMS
          sudo pacman -U ./*.pkg.tar.zst
          \`\`\`
          EOF

          ccache -s || true
          BUILD

      - name: Generate release metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA:0:8}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=dux-apps-${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Dux Apps - Arch Linux x86-64-v3
          body_path: dux-build/dist/RELEASE_BODY.md
          files: |
            dux-build/dist/*.pkg.tar.zst
            dux-build/dist/SHA256SUMS
          fail_on_unmatched_files: true
          make_latest: true
