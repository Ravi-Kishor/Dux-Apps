
name: Build Dux Apps - Arch Linux x86-64-v3

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Checkout Dux Apps
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel \
            binutils \
            git \
            go \
            make \
            tar \
            gzip \
            zstd \
            coreutils \
            findutils \
            file \
            cmake \
            ninja \
            pkgconf \
            qt6-base \
            qt6-declarative \
            qt6-shadertools \
            vulkan-headers \
            cli11 \
            wayland-protocols \
            pipewire \
            polkit \
            greetd \
            quickshell

      - name: Prepare builder
        run: |
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build and package applications
        shell: bash
        run: |
          runuser -u builder -- env \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            bash -s <<'BUILD'

          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/dux-build"
          SOURCES="$ROOT/sources"
          STAGES="$ROOT/stages"
          DIST="$ROOT/dist"

          mkdir -p "$SOURCES" "$STAGES" "$DIST"

          # All Go applications target Zen 3 / x86-64-v3.
          export GOAMD64=v3

          clone_repo() {
            local name="$1"
            local url="$2"

            git clone --recurse-submodules "$url" "$SOURCES/$name"
          }

          clone_repo dux-calendar \
            https://github.com/duxlabs-dev/dux-calendar.git

          clone_repo dux-gop \
            https://github.com/duxlabs-dev/dux-gop.git

          clone_repo dux-files \
            https://github.com/duxlabs-dev/dux-files.git

          clone_repo dux-greeter \
            https://github.com/duxlabs-dev/dux-greeter.git

          # Build Dux Calendar.
          CAL_STAGE="$STAGES/dux-calendar"
          mkdir -p "$CAL_STAGE"

          cd "$SOURCES/dux-calendar"
          make
          make PREFIX=/usr DESTDIR="$CAL_STAGE" install

          test -x "$CAL_STAGE/usr/bin/dcal"

          # Build Dux GOP.
          GOP_STAGE="$STAGES/dux-gop"
          mkdir -p "$GOP_STAGE/usr/bin"

          cd "$SOURCES/dux-gop"
          make

          test -x bin/dgop
          install -Dm755 bin/dgop "$GOP_STAGE/usr/bin/dgop"

          # Build Dux Files.
          FILES_STAGE="$STAGES/dux-files"
          mkdir -p "$FILES_STAGE"

          cd "$SOURCES/dux-files"
          make
          make PREFIX=/usr DESTDIR="$FILES_STAGE" install

          test -x "$FILES_STAGE/usr/bin/dfiles"

          # Build Dux Greeter with the Qt Base integration.
          GREETER_STAGE="$STAGES/dux-greeter"
          mkdir -p "$GREETER_STAGE"

          cd "$SOURCES/dux-greeter"
          make QTBASE=1 build
          make QTBASE=1 PREFIX=/usr DESTDIR="$GREETER_STAGE" install

          test -x "$GREETER_STAGE/usr/bin/dms-greeter"

          # Add license and README files to package payloads.
          add_docs() {
            local repo="$1"
            local stage="$2"
            local package="$3"

            if [[ -f "$repo/LICENSE" ]]; then
              install -Dm644 "$repo/LICENSE" \
                "$stage/usr/share/licenses/$package/LICENSE"
            fi

            if [[ -f "$repo/README.md" ]]; then
              install -Dm644 "$repo/README.md" \
                "$stage/usr/share/doc/$package/README.md"
            fi
          }

          add_docs "$SOURCES/dux-calendar" "$CAL_STAGE" dux-calendar-git
          add_docs "$SOURCES/dux-gop" "$GOP_STAGE" dux-gop-git
          add_docs "$SOURCES/dux-files" "$FILES_STAGE" dux-files-git
          add_docs "$SOURCES/dux-greeter" "$GREETER_STAGE" greetd-dms-greeter-git

          # Verify the Go compiler target in every application.
          verify_go_binary() {
            local binary="$1"

            echo "Checking: $binary"
            go version -m "$binary" | grep -F 'GOAMD64=v3'
          }

          verify_go_binary "$CAL_STAGE/usr/bin/dcal"
          verify_go_binary "$GOP_STAGE/usr/bin/dgop"
          verify_go_binary "$FILES_STAGE/usr/bin/dfiles"
          verify_go_binary "$GREETER_STAGE/usr/bin/dms-greeter"

          # Create a standalone Arch package from a staged filesystem.
          build_arch_package() {
            local name="$1"
            local stage="$2"
            local repo="$3"
            local dependencies="$4"

            local count
            local short_sha
            local pkgver
            local pkgdir
            local payload
            local output_dir
            local package_file
            local package_count

            cd "$repo"

            count="$(git rev-list --count HEAD)"
            short_sha="$(git rev-parse --short=8 HEAD)"
            pkgver="0.0.0.r${count}.g${short_sha}"

            pkgdir="$ROOT/pkgbuild-$name"
            payload="$pkgdir/payload"
            output_dir="$pkgdir/out"

            rm -rf "$pkgdir"
            mkdir -p "$payload" "$output_dir"

            cp -a "$stage/." "$payload/"

            cat > "$pkgdir/PKGBUILD" <<EOF
          pkgname='$name'
          pkgver='$pkgver'
          pkgrel=1
          pkgdesc='Dux Labs application - x86-64-v3 build'
          arch=('x86_64')
          url='https://github.com/duxlabs-dev'
          license=('custom')
          options=('!debug')
          depends=($dependencies)
          source=()
          sha256sums=()

          package() {
            install -d "\$pkgdir"
            cp -a "\$startdir/payload/." "\$pkgdir/"
          }
          EOF

            cd "$pkgdir"

            # Keep package creation unprivileged.
            PKGDEST="$output_dir" makepkg \
              --nodeps \
              --cleanbuild \
              --noconfirm \
              --force

            # Select only the main package, never the -debug package.
            mapfile -t packages < <(
              find "$output_dir" -maxdepth 1 -type f \
                -name "${name}-*.pkg.tar.zst" \
                ! -name '*-debug-*'
            )

            package_count="${#packages[@]}"

            if [[ "$package_count" -ne 1 ]]; then
              echo "Expected one main package for $name, found $package_count"
              find "$output_dir" -maxdepth 1 -type f -printf '%f\n'
              return 1
            fi

            package_file="${packages[0]}"

            install -Dm644 "$package_file" \
              "$DIST/${name}-${pkgver}-1-x86_64_v3.pkg.tar.zst"

            echo "Created: ${name}-${pkgver}-1-x86_64_v3.pkg.tar.zst"
          }

          # Package all four applications independently.
          build_arch_package \
            dux-calendar-git \
            "$CAL_STAGE" \
            "$SOURCES/dux-calendar" \
            "'quickshell'"

          build_arch_package \
            dux-gop-git \
            "$GOP_STAGE" \
            "$SOURCES/dux-gop" \
            ""

          build_arch_package \
            dux-files-git \
            "$FILES_STAGE" \
            "$SOURCES/dux-files" \
            "'quickshell'"

          build_arch_package \
            greetd-dms-greeter-git \
            "$GREETER_STAGE" \
            "$SOURCES/dux-greeter" \
            "'greetd' 'quickshell'"

          # Generate checksums.
          cd "$DIST"
          sha256sum *.pkg.tar.zst > SHA256SUMS

          BUILD

      - name: Generate release metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA:0:8}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=dux-apps-${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Dux Apps - Arch Linux x86-64-v3
          body: |
            ## Dux Apps - Arch Linux Packages

            Optimized for x86-64-v3 (Zen 3 and newer).

            ### Packages
            - Dux Calendar
            - Dux GOP
            - Dux Files
            - Dux Greeter

            All Go binaries are built with `GOAMD64=v3`.
            Dux Greeter is built with `QTBASE=1`.

            Package architecture metadata remains `x86_64`.
            The `_x86_64_v3` suffix identifies the optimized build target.

            Install packages:

            ```bash
            sudo pacman -U ./*.pkg.tar.zst
            ```

            Verify checksums:

            ```bash
            sha256sum -c SHA256SUMS
            ```
          files: |
            dux-build/dist/*.pkg.tar.zst
            dux-build/dist/SHA256SUMS
          fail_on_unmatched_files: true
          make_latest: true
