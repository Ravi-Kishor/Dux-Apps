name: Build dux-qt-base-git

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: dux-qt-base-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      # -------------------------
      # Update system
      # -------------------------
      - name: Update system
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git curl sudo

      # -------------------------
      # Install dependencies
      # (cpptrace + jemalloc not needed: CRASH_HANDLER/USE_JEMALLOC default OFF)
      # -------------------------
      - name: Install dependencies
        run: |
          pacman -S --noconfirm --needed \
            cmake ninja pkgconf clang lld cli11 \
            qt6-base qt6-declarative qt6-svg qt6-wayland qt6-shadertools \
            spirv-tools wayland wayland-protocols \
            libdrm libxkbcommon libxcb libpipewire \
            mesa libglvnd vulkan-headers vulkan-icd-loader \
            pam polkit glib2 base-devel git go tar gzip coreutils findutils pipewire

      # -------------------------
      # Create builder
      # -------------------------
      - name: Create builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      # -------------------------
      # Generate PKGBUILD
      # -------------------------
      - name: Create dux-qt-base PKGBUILD
        run: |
          mkdir -p /home/builder/pkg
          cat > /home/builder/pkg/PKGBUILD <<'EOF'
          pkgbase=dux-qt-base-git
          pkgname=(dux-qt-base-git dux-qt-base-git-devel)
          pkgver=0.0.0
          pkgrel=1
          pkgdesc="Quickshell runtime built as a shared library (libdux-qt-base.so)"
          arch=(x86_64)
          url="https://github.com/duxlabs-dev/dux-qt-base"
          license=(LGPL-3.0-only)
          options=(!debug !lto)

          makedepends=(
            cmake
            ninja
            pkgconf
            clang
            lld
            cli11
            git
            qt6-base
            qt6-declarative
            qt6-wayland
            qt6-shadertools
            qt6-svg
            spirv-tools
            wayland
            wayland-protocols
            vulkan-headers
            libdrm
            libxkbcommon
            libxcb
            libpipewire
            mesa
            libglvnd
            pam
            polkit
            glib2
          )

          source=("dux-qt-base::git+https://github.com/duxlabs-dev/dux-qt-base.git#branch=master")
          sha256sums=('SKIP')

          pkgver() {
            cd "$srcdir/dux-qt-base"
            if git describe --long --tags --abbrev=7 >/dev/null 2>&1; then
              git describe --long --tags --abbrev=7 \
                | sed 's/^v//;s/-/.r/;s/-/./'
            else
              printf "r%s.%s" \
                "$(git rev-list --count HEAD)" \
                "$(git rev-parse --short=7 HEAD)"
            fi
          }

          build() {
            cd "$srcdir/dux-qt-base"

            _flags="-pthread -O2 -pipe -march=znver3 -mtune=znver3 -ffunction-sections -fdata-sections -fvisibility-inlines-hidden"
            _ldflags="-fuse-ld=lld -Wl,-O1 -Wl,--as-needed -Wl,--gc-sections"

            CC=clang CXX=clang++ cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DDISTRIBUTOR="GitHub Actions (dux-qt-base-git)" \
              -DGIT_REVISION="$(git rev-parse HEAD)" \
              -DCMAKE_C_FLAGS="$_flags" \
              -DCMAKE_CXX_FLAGS="$_flags" \
              -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG" \
              -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG" \
              -DCMAKE_SHARED_LINKER_FLAGS="$_ldflags" \
              -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
              -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
              -DHYPRLAND=OFF \
              -DI3=OFF \
              -DX11=OFF

            cmake --build build --parallel "$(nproc)"
          }

          package_dux-qt-base-git() {
            depends=(
              gcc-libs
              glibc
              libdrm
              libxkbcommon
              libxcb
              libpipewire
              libglvnd
              mesa
              pam
              polkit
              glib2
              qt6-base
              qt6-declarative
              qt6-wayland
              wayland
            )
            optdepends=('qt6-svg: svg images and icons')
            provides=(dux-qt-base libdux-qt-base.so)
            conflicts=(dux-qt-base)

            cd "$srcdir/dux-qt-base"
            DESTDIR="$pkgdir" cmake --install build

            # runtime = .so.0 + .so.<version> only
            rm -rf "$pkgdir/usr/include" "$pkgdir/usr/lib/pkgconfig"
            rm -f "$pkgdir/usr/lib/libdux-qt-base.so"
          }

          package_dux-qt-base-git-devel() {
            pkgdesc+=" (development files)"
            depends=("dux-qt-base-git=$pkgver-$pkgrel")
            provides=(dux-qt-base-devel)
            conflicts=(dux-qt-base-devel)

            cd "$srcdir/dux-qt-base"
            DESTDIR="$srcdir/stage" cmake --install build

            # dev = .so symlink + .pc + header
            install -d "$pkgdir/usr/lib/pkgconfig" "$pkgdir/usr/include"
            cp -a "$srcdir/stage/usr/lib/libdux-qt-base.so" "$pkgdir/usr/lib/"
            cp -a "$srcdir/stage/usr/lib/pkgconfig/dux-qt-base.pc" "$pkgdir/usr/lib/pkgconfig/"
            cp -a "$srcdir/stage/usr/include/dux-qt-base" "$pkgdir/usr/include/"
          }
          EOF

      # -------------------------
      # Show effective flags (proves this yml version is the one running)
      # -------------------------
      - name: Show build flags
        run: |
          echo "yml-version: pthread-pch-o2-v2"
          grep -nE 'pthread|PRECOMPILE|FLAGS_RELEASE' /home/builder/pkg/PKGBUILD

      # -------------------------
      # Build package
      # -------------------------
      - name: Build dux-qt-base packages
        run: |
          chown -R builder:builder /home/builder
          su builder -c '
            export PACKAGER="Ravi Kishor <github@ravi>"
            export MAKEFLAGS="-j$(nproc)"
            cd ~/pkg
            makepkg -s --noconfirm
          '

      # -------------------------
      # Prepare release
      # -------------------------
      - name: Prepare release files
        id: pkg
        run: |
          mkdir -p release
          cp /home/builder/pkg/*.pkg.tar.zst release/

          RUNTIME_PKG=$(ls release/*.pkg.tar.zst | grep -v -- '-devel-' | head -n1)
          VERSION=$(pacman -Qp "$RUNTIME_PKG" | awk '{print $2}')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # -------------------------
      # Upload artifact
      # -------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dux-qt-base-release
          path: release/*.pkg.tar.zst

      # -------------------------
      # GitHub Release
      # -------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.version }}-znver3
          name: dux-qt-base-git ${{ steps.pkg.outputs.version }} (znver3)
          files: release/*.pkg.tar.zst
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
