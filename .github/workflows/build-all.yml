name: Build All Dux Apps (Calendar + GOP + Files + Greeter + Qt Base / Zen 3)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: dux-apps-combined-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel git go make tar gzip coreutils findutils sudo zstd \
            cmake ninja pkgconf cli11 wayland-protocols pipewire polkit \
            qt6-base qt6-declarative qt6-shadertools qt6-svg qt6-wayland \
            vulkan-headers spirv-tools wayland libdrm libxkbcommon libxcb \
            libpipewire mesa libglvnd vulkan-icd-loader pam glib2
          go version
          git --version
          make --version | head -n 1

          # makepkg must not run as root.
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      # Build Dux Qt Base first, with the same optimized flags as the standalone workflow.
      # It is installed with pacman so Dux Greeter builds against this optimized copy.
      - name: Build and install optimized Dux Qt Base
        id: qtbase
        shell: bash
        run: |
          set -euo pipefail
          OUT="$PWD/release-assets"
          mkdir -p "$OUT"

          mkdir -p /home/builder/pkg
          cat > /home/builder/pkg/PKGBUILD <<'EOF'
          pkgname=dux-qt-base
          pkgver=0.0.0
          pkgrel=1
          pkgdesc="Quickshell runtime built as a shared library (libdux-qt-base.so)"
          arch=(x86_64)
          url="https://github.com/duxlabs-dev/dux-qt-base"
          license=(LGPL-3.0-only)
          options=(!debug !lto !docs !libtool !staticlibs strip)

          makedepends=(
            cmake ninja pkgconf cli11 git
            qt6-base qt6-declarative qt6-wayland qt6-shadertools qt6-svg
            spirv-tools wayland wayland-protocols vulkan-headers
            libdrm libxkbcommon libxcb libpipewire mesa libglvnd
            pam polkit glib2
          )

          source=("dux-qt-base::git+https://github.com/duxlabs-dev/dux-qt-base.git#branch=master")
          sha256sums=('SKIP')

          pkgver() {
            cd "$srcdir/dux-qt-base"
            if git describe --long --tags --abbrev=7 >/dev/null 2>&1; then
              git describe --long --tags --abbrev=7 \
                | sed 's/^v//;s/-/.r/;s/-/./'
            else
              printf "r%s.%s" \
                "$(git rev-list --count HEAD)" \
                "$(git rev-parse --short=7 HEAD)"
            fi
          }

          build() {
            cd "$srcdir/dux-qt-base"

            # Zen 3 (Ryzen 5600GT): fast code, no debug info, dead code stripped
            _flags="-O3 -g0 -pipe -march=znver3 -mtune=znver3 -fno-plt -fno-semantic-interposition -ffunction-sections -fdata-sections"
            _ldflags="-flto=auto -Wl,-O1 -Wl,--as-needed -Wl,--gc-sections -Wl,--sort-common -Wl,--hash-style=gnu -Wl,-s"

            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DDISTRIBUTOR="GitHub Actions (dux-qt-base)" \
              -DGIT_REVISION="$(git rev-parse HEAD)" \
              -DCMAKE_C_FLAGS="$_flags" \
              -DCMAKE_CXX_FLAGS="$_flags" \
              -DCMAKE_C_FLAGS_RELEASE="-O3 -g0 -DNDEBUG" \
              -DCMAKE_CXX_FLAGS_RELEASE="-O3 -g0 -DNDEBUG" \
              -DCMAKE_SHARED_LINKER_FLAGS="$_ldflags" \
              -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON

            cmake --build build --parallel "$(nproc)"
          }

          package() {
            depends=(
              gcc-libs glibc libdrm libxkbcommon libxcb libpipewire
              libglvnd mesa pam polkit glib2 qt6-base qt6-declarative
              qt6-wayland wayland
            )
            optdepends=('qt6-svg: svg images and icons')
            provides=(quickshell)
            conflicts=(dux-qt-base-git dux-qt-base-git-devel dux-qt-base-bin)
            replaces=(dux-qt-base-git dux-qt-base-git-devel)

            cd "$srcdir/dux-qt-base"
            DESTDIR="$pkgdir" cmake --install build

            # runtime = .so.0 + .so.<version> only
            rm -rf "$pkgdir/usr/include" "$pkgdir/usr/lib/pkgconfig"
            rm -f "$pkgdir/usr/lib/libdux-qt-base.so"
          }
          EOF

          git config --global --add safe.directory '*'
          sed -i 's/^COMPRESSZST=.*/COMPRESSZST=(zstd -c -T0 --ultra -22 -)/' /etc/makepkg.conf
          chown -R builder:builder /home/builder
          su builder -c '
            export PACKAGER="Ravi Kishor <github@ravi>"
            export MAKEFLAGS="-j$(nproc)"
            cd ~/pkg
            makepkg -s --noconfirm
          '

          QTBASE_PKG="$(ls /home/builder/pkg/dux-qt-base-*.pkg.tar.zst | head -n1)"
          test -s "$QTBASE_PKG"
          cp "$QTBASE_PKG" "$OUT/"

          # Install the optimized runtime so the greeter build uses it.
          pacman -U --noconfirm "$QTBASE_PKG"

          echo "qtbase_commit=$(git -C /home/builder/pkg/src/dux-qt-base rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "qtbase_version=$(pacman -Qp "$QTBASE_PKG" | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "qtbase_file=$(basename "$QTBASE_PKG")" >> "$GITHUB_OUTPUT"

      - name: Clone and build all upstream repositories
        id: build
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/dux-build"
          OUT="$PWD/release-assets"
          mkdir -p "$ROOT" "$OUT"
          cd "$ROOT"

          git clone --recurse-submodules https://github.com/duxlabs-dev/dux-calendar.git
          git clone --recurse-submodules https://github.com/duxlabs-dev/dux-gop.git
          git clone --recurse-submodules https://github.com/duxlabs-dev/dux-files.git
          #git clone --recurse-submodules -b quicklook https://github.com/Ravi-Kishor/dux-files.git
          git clone --recurse-submodules https://github.com/duxlabs-dev/dux-greeter.git

          for repo in dux-calendar dux-gop dux-files dux-greeter; do
            git -C "$repo" submodule sync --recursive
            git -C "$repo" submodule update --init --recursive
          done

          # Dux Calendar
          cd "$ROOT/dux-calendar"
          make
          CAL_STAGE="$ROOT/stage-calendar"
          mkdir -p "$CAL_STAGE"
          make PREFIX=/usr DESTDIR="$CAL_STAGE" install
          install -Dm0644 LICENSE "$CAL_STAGE/usr/share/licenses/dux-calendar/LICENSE"
          install -Dm0644 README.md "$CAL_STAGE/usr/share/doc/dux-calendar/README.md"
          CAL_COMMIT="$(git rev-parse HEAD)"
          CAL_VERSION="$(git describe --tags --always 2>/dev/null || git rev-parse --short=7 HEAD)"
          install -d "$CAL_STAGE/usr/share/doc/dux-calendar"
          printf 'repository=https://github.com/duxlabs-dev/dux-calendar\ncommit=%s\nversion=%s\ngo_version=%s\n' \
            "$CAL_COMMIT" "$CAL_VERSION" "$(go version)" \
            > "$CAL_STAGE/usr/share/doc/dux-calendar/build-info.txt"
          test -d "$CAL_STAGE/usr"
          tar -C "$CAL_STAGE" -czf "$OUT/dux-calendar-x86_64.tar.gz" .

          # Dux GOP
          cd "$ROOT/dux-gop"
          make
          GOP_STAGE="$ROOT/stage-gop"
          mkdir -p "$GOP_STAGE"
          # Upstream GOP Makefile ignores DESTDIR, so stage the binary directly.
          install -Dm0755 bin/dgop "$GOP_STAGE/usr/bin/dgop"
          install -Dm0644 LICENSE "$GOP_STAGE/usr/share/licenses/dux-gop/LICENSE"
          install -Dm0644 README.md "$GOP_STAGE/usr/share/doc/dux-gop/README.md"
          GOP_COMMIT="$(git rev-parse HEAD)"
          GOP_VERSION="$(git describe --tags --always 2>/dev/null || git rev-parse --short=7 HEAD)"
          install -d "$GOP_STAGE/usr/share/doc/dux-gop"
          printf 'repository=https://github.com/duxlabs-dev/dux-gop\ncommit=%s\nversion=%s\ngo_version=%s\n' \
            "$GOP_COMMIT" "$GOP_VERSION" "$(go version)" \
            > "$GOP_STAGE/usr/share/doc/dux-gop/build-info.txt"
          tar -C "$GOP_STAGE" -czf "$OUT/dux-gop-x86_64.tar.gz" .

          # Dux Files
          cd "$ROOT/dux-files"
          make
          FILES_STAGE="$ROOT/stage-files"
          mkdir -p "$FILES_STAGE"
          make PREFIX=/usr DESTDIR="$FILES_STAGE" install
          install -Dm0644 LICENSE "$FILES_STAGE/usr/share/licenses/dux-files/LICENSE"
          install -Dm0644 README.md "$FILES_STAGE/usr/share/doc/dux-files/README.md"
          FILES_COMMIT="$(git rev-parse HEAD)"
          FILES_VERSION="$(git describe --tags --always 2>/dev/null || git rev-parse --short=7 HEAD)"
          install -d "$FILES_STAGE/usr/share/doc/dux-files"
          printf 'repository=https://github.com/duxlabs-dev/dux-files\ncommit=%s\nversion=%s\ngo_version=%s\n' \
            "$FILES_COMMIT" "$FILES_VERSION" "$(go version)" \
            > "$FILES_STAGE/usr/share/doc/dux-files/build-info.txt"
          tar -C "$FILES_STAGE" -czf "$OUT/dux-files-x86_64.tar.gz" .

          # Dux Greeter: uses the optimized Dux Qt Base installed above.
          cd "$ROOT/dux-greeter"
          echo "--- greeter Makefile qtbase references ---"
          grep -n -i qtbase Makefile || true
          echo "-------------------------------------------"
          make QTBASE=1 build

          GREETER_STAGE="$ROOT/stage-greeter"
          mkdir -p "$GREETER_STAGE"
          make PREFIX=/usr DESTDIR="$GREETER_STAGE" install
          install -Dm0644 LICENSE "$GREETER_STAGE/usr/share/licenses/dux-greeter/LICENSE"
          install -Dm0644 README.md "$GREETER_STAGE/usr/share/doc/dux-greeter/README.md"
          GREETER_COMMIT="$(git rev-parse HEAD)"
          GREETER_VERSION="$(git describe --tags --always 2>/dev/null || git rev-parse --short=7 HEAD)"
          install -d "$GREETER_STAGE/usr/share/doc/dux-greeter"
          printf 'repository=https://github.com/duxlabs-dev/dux-greeter\ncommit=%s\nversion=%s\ngo_version=%s\nqtbase=system-optimized\n' \
            "$GREETER_COMMIT" "$GREETER_VERSION" "$(go version)" \
            > "$GREETER_STAGE/usr/share/doc/dux-greeter/build-info.txt"
          test -x "$GREETER_STAGE/usr/bin/dms-greeter"
          tar -C "$GREETER_STAGE" -czf "$OUT/dux-greeter-x86_64.tar.gz" .

          # Verify all artifacts
          QTBASE_FILE="$OUT/${{ steps.qtbase.outputs.qtbase_file }}"
          for artifact in \
            "$OUT/dux-calendar-x86_64.tar.gz" \
            "$OUT/dux-gop-x86_64.tar.gz" \
            "$OUT/dux-files-x86_64.tar.gz" \
            "$OUT/dux-greeter-x86_64.tar.gz" \
            "$QTBASE_FILE"; do
            test -s "$artifact"
            sha256sum "$artifact"
          done

          QTBASE_COMMIT="${{ steps.qtbase.outputs.qtbase_commit }}"
          TAG="dux-apps-${CAL_COMMIT:0:8}-${GOP_COMMIT:0:8}-${FILES_COMMIT:0:8}-${GREETER_COMMIT:0:8}-${QTBASE_COMMIT:0:8}"
          {
            echo "tag=$TAG"
            echo "calendar_commit=$CAL_COMMIT"
            echo "gop_commit=$GOP_COMMIT"
            echo "files_commit=$FILES_COMMIT"
            echo "greeter_commit=$GREETER_COMMIT"
            echo "qtbase_commit=$QTBASE_COMMIT"
            echo "calendar_version=$CAL_VERSION"
            echo "gop_version=$GOP_VERSION"
            echo "files_version=$FILES_VERSION"
            echo "greeter_version=$GREETER_VERSION"
            echo "qtbase_version=${{ steps.qtbase.outputs.qtbase_version }}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Combined Dux Apps build"
            echo
            echo "All five repositories were fetched at their latest upstream HEAD and built in the same workflow run."
            echo
            echo "| Component | Upstream commit | Upstream version | SHA-256 |"
            echo "|---|---|---|---|"
            echo "| Dux Calendar | $CAL_COMMIT | $CAL_VERSION | $(sha256sum "$OUT/dux-calendar-x86_64.tar.gz" | cut -d' ' -f1) |"
            echo "| Dux GOP | $GOP_COMMIT | $GOP_VERSION | $(sha256sum "$OUT/dux-gop-x86_64.tar.gz" | cut -d' ' -f1) |"
            echo "| Dux Files | $FILES_COMMIT | $FILES_VERSION | $(sha256sum "$OUT/dux-files-x86_64.tar.gz" | cut -d' ' -f1) |"
            echo "| Dux Greeter | $GREETER_COMMIT | $GREETER_VERSION | $(sha256sum "$OUT/dux-greeter-x86_64.tar.gz" | cut -d' ' -f1) |"
            echo "| Dux Qt Base | $QTBASE_COMMIT | ${{ steps.qtbase.outputs.qtbase_version }} | $(sha256sum "$QTBASE_FILE" | cut -d' ' -f1) |"
            echo
            echo "Architecture: x86_64. Build environment: Arch Linux container."
            echo "Dux Qt Base: znver3, LTO, zstd ultra. Dux Greeter built against it."
            echo "Upstream Quickshell child mode: disabled."
            echo
            echo "Each tar.gz contains files staged under /usr; extract from / to install."
            echo "Dux Qt Base installs with: sudo pacman -U <file>"
            echo "Review archive contents before installing."
          } > "$OUT/release-notes.md"

      - name: Publish one combined GitHub Release with five assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          name: Dux Apps Combined Build (Calendar + GOP + Files + Greeter + Qt Base / ${{ github.run_number }})
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
          body_path: release-assets/release-notes.md
          files: |
            release-assets/dux-calendar-x86_64.tar.gz
            release-assets/dux-gop-x86_64.tar.gz
            release-assets/dux-files-x86_64.tar.gz
            release-assets/dux-greeter-x86_64.tar.gz
            release-assets/dux-qt-base-*.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
